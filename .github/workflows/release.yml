name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# This workflow tests and publishes. It writes nothing into another repo.
#
# `make types` at the repo root generates and copies every consumer's file —
# models, js/sdk-js, js/app, js/common-js, js/sdk-js-app, sdk-py and swift —
# and prints what to commit alongside the change that needed it. `make
# types-release` then commits models, tags, and points the Go consumers at
# the new version.
#
# It used to dispatch update-dep.yml to the Go consumers and update-types.yml
# to the JS and Python ones, and both committed and pushed to dev as
# github-actions[bot]. That was a second writer racing the first: it fetched
# the file from the tag, so it could overwrite a newer local copy, and it
# landed mid-edit in a checkout several people and sessions share.
#
# Go consumers pick new tags up through their own dependabot, which is where
# that check belongs — in the repo doing the depending.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Ask the proxy for the tag so it is cached before anything depends on
      # it. Without this a consumer's first `go get` races the proxy's own
      # fetch and can fail on a tag that demonstrably exists.
      - name: Warm Go module proxy
        run: |
          curl -sf "https://proxy.golang.org/github.com/inference-sh/models/@v/${GITHUB_REF_NAME}.info" > /dev/null
