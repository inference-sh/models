name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  distribute:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Warm Go module proxy
        run: |
          GOPROXY=https://proxy.golang.org,direct \
          curl -sf "https://proxy.golang.org/github.com/inference-sh/models/@v/${GITHUB_REF_NAME}.info" > /dev/null

      # Go consumers (api, cli, engine) are bumped by `make types-release` in
      # go/api, which points each at the new tag and prints what to commit.
      # CI used to dispatch update-dep.yml, which committed and pushed go.mod
      # straight to their dev branches as the bot. Those repos are one shared
      # checkout, so that arrived mid-edit as a surprise commit to rebase past.
      #
      # The SDK dispatches below stay for now: those repos have no local path
      # that regenerates their types, so nothing else would update them. Note
      # they push to dev the same way, so the same surprise is possible there;
      # closing that needs a local path first.

      # Dispatch via REST API (avoids GraphQL defaultBranchRef lookup
      # that requires contents:read — PAT only has actions:write)
      - name: Dispatch to SDK consumers
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dispatch() {
            local repo=$1 workflow=$2; shift 2
            local inputs="{"
            local first=true
            while [ $# -gt 0 ]; do
              $first || inputs+=","
              inputs+="\"$1\":\"$2\""
              first=false; shift 2
            done
            inputs+="}"
            echo "Dispatching $workflow to $repo..."
            curl -sf -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/inference-sh/$repo/actions/workflows/$workflow/dispatches" \
              -d "{\"ref\":\"dev\",\"inputs\":$inputs}" || true
          }

          dispatch sdk-js     update-types.yml version "$VERSION" file sdk.ts  dest src/types.ts
          dispatch sdk-py     update-types.yml version "$VERSION" file sdk.py         dest src/inferencesh/types.py
          dispatch sdk-py     update-types.yml version "$VERSION" file llm_types.py  dest src/inferencesh/llm_types_gen.py
          dispatch app        update-types.yml version "$VERSION" file web.ts  dest src/lib/types/types.ts
          dispatch common-js  update-types.yml version "$VERSION" file web.ts  dest gen/types.ts
          dispatch sdk-js-app update-types.yml version "$VERSION" file app.ts  dest src/types.ts
